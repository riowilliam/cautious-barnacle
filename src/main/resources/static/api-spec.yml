      summary: Change Username
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                oldUsername: username
                newUsername: lorddev
                fullName: fullName
                password: password
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/user/changePassword:
    post:
      tags:
        - Users
      summary: Change Password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
